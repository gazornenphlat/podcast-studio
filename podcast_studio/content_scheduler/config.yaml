# ------------------------------------------------------------
#  Articles: used only to seed the list the first time.
#  After that, add/edit/delete articles in the GUI.
# ------------------------------------------------------------
articles:
  - title: Sample Article
    url: https://example.com/sample-article
    summary: A short summary that appears in the email body.
    image_url: ""

# ------------------------------------------------------------
#  Email (article sending AND email reminders).
#  Templates: {title} {summary} {url} {image_url} {from_name}
#  In the HTML template, {image_html} becomes an <img> if the
#  article has an image_url, otherwise nothing.
# ------------------------------------------------------------
email:
  smtp_host: smtp.gmail.com
  smtp_port: 587
  use_tls: true
  username: you@gmail.com
  from_name: Your Name
  from_address: you@gmail.com
  article_subject_template: "New article: {title}"
  article_body_template: |
    Hi,

    {summary}

    Read it here: {url}

    – {from_name}
  article_html_template: |
    <div style="font-family:Georgia,serif;max-width:600px;margin:auto;color:#222">
      <h2 style="margin-bottom:6px">{title}</h2>
      {image_html}
      <p style="font-size:16px;line-height:1.5">{summary}</p>
      <p><a href="{url}" style="display:inline-block;background:#2563eb;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none">Read the article</a></p>
      <p style="color:#888;font-size:13px">– {from_name}</p>
    </div>
  recipient_lists:
    subscribers: [friend1@example.com, friend2@example.com]
    family: [mom@example.com]

# ------------------------------------------------------------
#  Reminder channels – enable any combination.
# ------------------------------------------------------------
reminders:
  ntfy:
    enabled: true
    server: https://ntfy.sh
    topic: my-content-reminders-CHANGE-ME
  pushbullet:
    enabled: false
  email:
    enabled: false
    recipients: [you@gmail.com]
  google_tasks:
    enabled: false
    tasklist_id: "@default"
  google_calendar:
    enabled: false
    calendar_id: primary
    event_hour: 9

google:
  credentials_file: google_credentials.json   # OAuth client (Desktop app) from Google Cloud Console
  token_file: google_token.json
