# ============================================================
#  Content Scheduler – all configuration lives here.
#  Passwords / tokens go in secrets.yaml (see secrets.example.yaml);
#  it is merged on top of this file. Changes are picked up within
#  a minute – no restart needed.
# ============================================================

app:
  host: 127.0.0.1              # use 0.0.0.0 to reach it from your phone (snooze buttons)
  port: 5050
  public_url: ""               # e.g. http://192.168.1.50:5050 – enables Snooze/Done buttons in ntfy + email
  timezone: America/New_York
  check_time: "08:00"          # daily time reminders/auto-posts fire
  upload_warning_days: 3       # warn this many days before content runs out
  empty_window_days: 30        # remind if a series has nothing scheduled within this many days
  empty_repeat_days: 7         # ...and repeat that reminder this often until something is queued
  catchup_days: 7              # if the computer was off, replay up to this many missed days
  data_file: data.json
  inbox_folder: inbox          # finished episodes from podcast_pipeline land here and get queued automatically
  secrets_file: secrets.yaml
  open_browser_on_start: false  # tray.py: open the GUI automatically when it starts

backup:
  enabled: true
  folder: backups
  keep: 30                     # number of daily backups to keep

snooze:
  options_minutes: [60, 180, 1440]   # buttons shown in the GUI
  ntfy_minutes: 120                  # the Snooze button on phone notifications

# ------------------------------------------------------------
#  Templates. Variables you can use anywhere:
#   {series} {number} {title} {date} {site} {hashtags} {description}
#  Can be overridden per series or per site inside a series.
# ------------------------------------------------------------
templates:
  title: "{series} #{number} – {title}"
  # {meta_description}, {focus_keyphrase} and {keyphrases} come from each episode's
  # SEO file; they are empty (and their block is dropped) when an episode has none.
  description: |
    {description}

    {meta_description}

    {hashtags}

# ------------------------------------------------------------
#  VoiceStudio batch queue (Studio page, Voices tab).
#  Put api_key in secrets.yaml, not here.
# ------------------------------------------------------------
voicestudio:
  url: "http://127.0.0.1:3900/v1"
  api_key: ""
  data_dir: ""          # empty = Music\VoiceStudio in your user folder

# ------------------------------------------------------------
#  Sites. auto_post: true only works where an API exists and
#  credentials are in secrets.yaml. Otherwise you get a reminder
#  with the manual upload link. max_length warns in the GUI.
# ------------------------------------------------------------
sites:
  youtube:
    label: YouTube
    upload_url: https://studio.youtube.com
    auto_post: false           # true = upload the episode's video on its posting day
    api: youtube               # Google OAuth (google section below)
    format: wide               # wide = 16:9 episode video, vertical = 9:16 TikTok version
    privacy_status: private    # private | unlisted | public – how auto-uploaded videos go up
    max_length: 5000
  twitter:
    label: X / Twitter
    upload_url: https://x.com/compose/post
    auto_post: false
    api: twitter               # auto-post sends text only – keep false to post the video yourself
    format: wide
    max_length: 280
  tiktok:
    label: TikTok
    upload_url: https://www.tiktok.com/tiktokstudio/upload
    auto_post: false           # Content Posting API requires an audited developer app
    api: none
    format: vertical
    max_length: 2200
  rumble:
    label: Rumble
    upload_url: https://rumble.com/upload.php
    auto_post: false           # no public posting API
    api: none
    format: wide
  instagram:
    label: Instagram
    upload_url: https://www.instagram.com/
    auto_post: false           # Graph API: Business/Creator account + public media URL
    api: instagram             # auto-post handles images only – keep false for videos
    format: wide
    max_length: 2200
  substack:
    label: Substack
    upload_url: https://YOURNAME.substack.com/publish/post
    auto_post: false           # no public posting API
    api: none
    format: wide
  youtube_shorts:
    label: YouTube Shorts
    upload_url: https://studio.youtube.com
    auto_post: false           # true = upload the 9:16 version through the same Google sign-in as YouTube
    api: youtube
    format: vertical
    privacy_status: private
    max_length: 5000
  instagram_reels:
    label: Instagram Reels
    upload_url: https://www.instagram.com/
    auto_post: false
    api: none
    format: vertical
    max_length: 2200
  facebook:
    label: Facebook
    upload_url: https://www.facebook.com/
    auto_post: false
    api: none
    format: wide
    max_length: 5000
  facebook_reels:
    label: Facebook Reels
    upload_url: https://www.facebook.com/reels/create
    auto_post: false
    api: none
    format: vertical
    max_length: 2200
  odysee:
    label: Odysee
    upload_url: https://odysee.com/$/upload
    auto_post: false
    api: none
    format: wide
  spotify:
    label: Spotify
    upload_url: https://creators.spotify.com/
    auto_post: false           # video podcast episode
    api: none
    format: wide
    max_length: 4000
  website:
    label: My Website
    upload_url: https://example.com/wp-admin/post-new.php
    auto_post: false
    api: wordpress
    base_url: https://example.com
    post_status: draft         # draft | publish

# ------------------------------------------------------------
#  Series: same sites, same day every month.
#  day_of_month 29-31 falls back to the last day in short months.
#  start_number = episode number of the next post.
#  site_overrides lets each site have its own description,
#  hashtags, title_template or description_template.
# ------------------------------------------------------------
